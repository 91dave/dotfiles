# Extended keys for pi
set -g extended-keys on
#set -g extended-keys-format csi-u

# Change prefix from Ctrl+b to Ctrl+w
unbind C-b
set-option -g prefix C-w
bind-key C-w send-prefix

# Vertical split with 'v'
bind v split-window -h

# Horizontal split with 'h'
bind h split-window -v

# Rotate windows with 'r'
bind r rotate-window
bind t display-popup -w 80% -h 80% -T "Scratch Terminal"

# Set the terminal title to "folder:binary" (current dir + running command),
# independent of the session name so the cc-foo-2 dedup suffix doesn't show
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}:#{pane_current_command}"

# Longer session names in status bar
set -g status-left-length 30

# Grey bar with white text, so the agent emoji stay legible
set -g status-style 'bg=colour238,fg=white'

# Agent state across every session. See docs/tmux.md.
set -g @agent_colour '#{?#{m/r:^(permission|question|plan|waiting)$,#{@agent_win}},#[fg=magenta],#{?#{==:#{@agent_win},done},#[fg=green],#{?#{==:#{@agent_win},working},#[fg=yellow],}}}'
set -g window-status-format '#{E:@agent_colour}#I:#W#{?window_flags,#{window_flags}, }#[default]'
set -g window-status-current-format '#{E:@agent_colour}#I:#W#{?window_flags,#{window_flags}, }#[default]'

set -g status-interval 5
set -g status-right-length 200
set -g status-right '#(~/.local/bin/agent-state status "#{?session_group,#{session_group},#{session_name}}" --with-folder --width #{client_width})  #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y'

set-hook -ga after-select-pane 'run-shell -b "~/.local/bin/agent-state ack #{pane_id}"'
set-hook -ga after-select-window 'run-shell -b "~/.local/bin/agent-state ack #{pane_id}"'
set-hook -ga pane-focus-in 'run-shell -b "~/.local/bin/agent-state ack #{pane_id}"'
set-hook -ga client-session-changed 'run-shell -b "~/.local/bin/agent-state ack #{pane_id}"'

bind a display-popup -E -w 90% -h 80% -T "Agents" "~/.local/bin/agent-state pick"
bind s display-popup -E -w 90% -h 80% -T "Sessions" "~/.local/bin/tmux-sessions"

# Mouse Scrollwheel support
set -g mouse on
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

set -g status-left-length 30

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Agent Management Plugin
#set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
