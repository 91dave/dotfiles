# Extended keys for pi
set -g extended-keys on
#set -g extended-keys-format csi-u

# Change prefix from Ctrl+b to Ctrl+w
unbind C-b
set-option -g prefix C-w
bind-key C-w send-prefix

# Vertical split with 'v'
bind v split-window -h

# Horizontal split with 'h'
bind h split-window -v

# Rotate windows with 'r'
bind r rotate-window
bind t display-popup -w 80% -h 80% -T "Scratch Terminal"

# Set the terminal title to "folder:binary" (current dir + running command),
# independent of the session name so the cc-foo-2 dedup suffix doesn't show
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}:#{pane_current_command}"

# Longer session names in status bar
set -g status-left-length 30

# Mouse Scrollwheel support
set -g mouse on
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

set -g status-left-length 30

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Agent Management Plugin
#set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
